[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-chatgpt"
version = "0.1.0"
description = "Expose Codex-managed ChatGPT auth headers and quota from a small CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-chatgpt = "codex_chatgpt:main"

[tool.setuptools]
py-modules = ["codex_chatgpt"]
